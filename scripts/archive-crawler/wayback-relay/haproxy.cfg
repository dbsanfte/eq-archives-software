global
    log stdout format raw local0
    maxconn 32
    nbthread 1
    user haproxy
    group haproxy

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 8s
    timeout client 90s
    timeout server 90s
    retries 0

resolvers azure
    nameserver platform 168.63.129.16:53

frontend private_tunnel
    bind 127.0.0.1:18442
    default_backend wayback

backend wayback
    balance roundrobin
    # All four servers intentionally share the same destination address.
    default-server resolvers azure resolve-prefer ipv4 resolve-opts allow-dup-ip init-addr last,libc,none
    server ipv4-1 web.archive.org:443 source 10.248.39.4
    server ipv4-2 web.archive.org:443 source 10.248.39.5
    server ipv4-3 web.archive.org:443 source 10.248.39.6
    server ipv4-4 web.archive.org:443 source 10.248.39.7
