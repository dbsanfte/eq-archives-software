apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eqarchives-curation
  namespace: eqarchives-es
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 25Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eqarchives-curation
  namespace: eqarchives-es
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eqarchives-curation
  namespace: eqarchives-es
rules:
  # The controller never patches, suspends or deletes existing ingestion Jobs.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eqarchives-curation
  namespace: eqarchives-es
subjects:
  - kind: ServiceAccount
    name: eqarchives-curation
    namespace: eqarchives-es
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eqarchives-curation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eqarchives-curation
  namespace: eqarchives-es
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: eqarchives-curation
  template:
    metadata:
      labels:
        app: eqarchives-curation
    spec:
      serviceAccountName: eqarchives-curation
      # /var/run aliases /run. An automatic service-account mount beneath
      # /run/secrets cannot be created after that read-only Secret is mounted.
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: eqvm
      # Bind ONLY status.hostIP:8090, require that IP and every client peer to
      # belong to 192.168.0.0/16. No Service, NodePort or public Ingress exists.
      # Host networking preserves actual peer addresses without proxy/SNAT trust.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-pilot
          image: eqarchives-curation:deploy-via-ci
          command: [python, /app/curation/seed.py, --source, /seed, --root, /data, --owner, '10001']
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          volumeMounts:
            - name: staging
              mountPath: /data
            - name: pilot
              mountPath: /seed
              readOnly: true
      containers:
        - name: curation
          image: eqarchives-curation:deploy-via-ci
          ports:
            - name: intranet
              containerPort: 8090
          env:
            - name: LAN_BIND_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: IMPORT_IMAGE
              value: eqarchives-curation:deploy-via-ci
            - name: ARCHIVE_REPO
              value: /archive
            - name: ARCHIVE_OBJECT_DIRECTORIES
              value: /archive-source-objects
            - name: KUBERNETES_CREDENTIALS_DIR
              value: /run/kubernetes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: intranet
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: intranet
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: intranet
            periodSeconds: 20
          volumeMounts:
            - name: staging
              mountPath: /data
            - name: archive
              mountPath: /archive
              readOnly: true
            - name: archive-source-objects
              mountPath: /archive-source-objects
              readOnly: true
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
            - name: kubernetes
              mountPath: /run/kubernetes
              readOnly: true
            - name: temporary
              mountPath: /tmp
      imagePullSecrets:
        - name: dockerhub-pull-secret
      volumes:
        - name: staging
          persistentVolumeClaim:
            claimName: eqarchives-curation
        - name: archive
          hostPath:
            path: /mnt/samsung/eq-archives
            type: Directory
        - name: archive-source-objects
          hostPath:
            path: /mnt/samsung/eq-archives-html-reindex/.git/objects
            type: Directory
        - name: pilot
          hostPath:
            path: /home/dbsanfte/eq-archives-research/crawler-pilot-2026-10-06
            type: DirectoryOrCreate
        - name: credentials
          secret:
            secretName: eqarchives-curation-secrets
            defaultMode: 288
        - name: kubernetes
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        - name: temporary
          emptyDir:
            sizeLimit: 16Mi
