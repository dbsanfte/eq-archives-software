---
apiVersion: v1
kind: Namespace
metadata:
  name: eqarchives-es
---
# Secret for the elastic (default) user password
apiVersion: v1
kind: Secret
metadata:
  name: elastic-password-secret
  namespace: eqarchives-es
type: Opaque
data:
  ELASTIC_PASSWORD: ELASTIC_PASSWORD_BASE64_ENCODED
---
# Secret for the readonly user password
apiVersion: v1
kind: Secret
metadata:
  name: elastic-readonly-password-secret
  namespace: eqarchives-es
type: Opaque
data:
  ELASTIC_READONLY_PASSWORD: ELASTIC_PASSWORD_BASE64_ENCODED
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-keys
  namespace: eqarchives-es
type: Opaque
data:
  access-key: S3_ACCESS_KEY_BASE64_ENCODED
  secret-key: S3_SECRET_KEY_BASE64_ENCODED
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: eqarchives-es
  labels:
    app: elasticsearch
spec:
  type: NodePort
  ports:
    - name: rest
      port: 9200
      targetPort: 9200
      nodePort: 31200
    - name: inter-node
      port: 9300
      targetPort: 9300
  selector:
    app: elasticsearch
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: eqarchives-es
spec:
  serviceName: "elasticsearch"
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          command: ["/bin/sh"]
          args:
            - -c
            - |
              # Install s3-repository plugin for snapshot backups
              ./bin/elasticsearch-plugin list | grep -q s3-repository || ./bin/elasticsearch-plugin install --batch s3-repository
              # Create AWS S3 snapshot secrets
              echo "$AWS_ACCESS_KEY_ID" | bin/elasticsearch-keystore add --stdin --force s3.client.default.access_key
              echo "$AWS_SECRET_ACCESS_KEY" | bin/elasticsearch-keystore add --stdin --force s3.client.default.secret_key
              # Launch entrypoint
              /usr/local/bin/docker-entrypoint.sh
          ports:
            - containerPort: 9200
              name: rest
            - containerPort: 9300
              name: inter-node
          env:
            - name: cluster.name
              value: "eqarchives-es"
            - name: bootstrap.memory_lock
              value: "true"
            - name: ES_JAVA_OPTS
              value: "-Xms4G -Xmx24G"
            - name: discovery.type
              value: "single-node"
            - name: reindex.remote.whitelist
              value: "192.168.50.145:9200"
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.transport.ssl.enabled
              value: "false"
            - name: xpack.security.transport.filter.enabled
              value: "false"
            - name: logger.org.elasticsearch
              value: "INFO"
            - name: http.cors.allow-origin
              value: "\"*\""
            - name: http.cors.enabled
              value: "true"
            - name: http.cors.allow-headers
              value: "x-elastic-client-meta,X-Requested-With,X-Auth-Token,Content-Type,Content-Length,Authorization"
            - name: http.cors.allow-credentials
              value: "true"
            - name: thread_pool.snapshot.max
              value: "4"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-password-secret
                  key: ELASTIC_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-keys
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-keys
                  key: secret-key
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "24Gi"
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
        - name: init-readonly
          image: curlimages/curl:7.85.0
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-password-secret
                  key: ELASTIC_PASSWORD
            - name: ELASTIC_READONLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-readonly-password-secret
                  key: ELASTIC_READONLY_PASSWORD
          command:
            - sh
            - -c
            - |
              # Wait until Elasticsearch is available on localhost:9200
              until curl -u "elastic:${ELASTIC_PASSWORD}" -s http://localhost:9200 > /dev/null; do
                echo "Waiting for Elasticsearch to be ready..."
                sleep 5
              done
              echo "Elasticsearch is up. Configuring security..."

              # Create or update the readonly role idempotently.
              curl -u "elastic:${ELASTIC_PASSWORD}" -XPUT "http://localhost:9200/_security/role/readonly" \
                -H 'Content-Type: application/json' \
                -d '{
                      "cluster": [],
                      "indices": [
                        {
                          "names": ["eq-archive"],
                          "privileges": ["read", "view_index_metadata"],
                          "allow_restricted_indices": false
                        }
                      ],
                      "applications": []
                    }'

              # Create or update the readonly user idempotently.
              curl -u "elastic:${ELASTIC_PASSWORD}" -XPUT "http://localhost:9200/_security/user/readonly" \
                -H 'Content-Type: application/json' \
                -d "{
                      \"password\": \"${ELASTIC_READONLY_PASSWORD}\",
                      \"roles\": [\"readonly\"],
                      \"full_name\": \"Read Only User\",
                      \"email\": \"readonly@example.com\",
                      \"enabled\": true
                    }"
              echo "Readonly user configured."

              # Create an S3 snapshot repo:
              curl -u "elastic:${ELASTIC_PASSWORD}" -XPUT "http://localhost:9200/_snapshot/eqarchives-s3-repository" \
                -H 'Content-Type: application/json' \
                -d '{
                      "type": "s3",
                      "settings": {
                        "bucket": "eq-archives-es",
                        "protocol": "https"
                      }
                    }'
              echo "Snapshot repository created."

              # Create an S3 snapshot policy and schedule:
              curl -u "elastic:${ELASTIC_PASSWORD}" -XPUT "http://localhost:9200/_slm/policy/eqarchives-snapshots" \
               -H 'Content-Type: application/json' \
               -d '{
                     "schedule": "0 12 12 * * ?",
                     "name": "<eqarchives-es-snapshot-{now/d}>",
                     "repository": "eqarchives-s3-repository",
                     "config": {
                       "indices": ["*"]
                     },
                     "retention": {
                       "min_count": 1,
                       "max_count": 30
                     }
                  }'
              echo "Snapshot policy and schedule created."

              # Keep the container alive to prevent restarts (optional)
              sleep infinity
      volumes:
        - name: elasticsearch-data
          hostPath:
            path: /mnt/samsung/es
            type: DirectoryOrCreate