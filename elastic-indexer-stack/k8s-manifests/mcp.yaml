apiVersion: apps/v1
kind: Deployment
metadata:
  name: eqarchives-mcp
  namespace: eqarchives-es
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: eqarchives-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: eqarchives-mcp
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # This distinct placeholder lets CI pin both artifacts independently.
          image: eqarchives-mcp:deploy-via-ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch.eqarchives-es.svc.cluster.local:9200
            - name: ELASTICSEARCH_INDEX
              value: eq-archive
            - name: EMBEDDING_URL
              value: http://nomic-embeddings.eqarchives-es.svc.cluster.local:8080
            - name: EMBEDDING_MODEL
              value: text-embedding-nomic-embed-text-v1.5@q8_0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
      imagePullSecrets:
        - name: dockerhub-pull-secret
      volumes:
        - name: credentials
          secret:
            secretName: search-eqarchives-secrets
            defaultMode: 288 # 0440; readable by the pod's fsGroup
            items:
              - key: es_readonly_username
                path: es_readonly_username
              - key: es_readonly_password
                path: es_readonly_password
              - key: openai_api_key
                path: openai_api_key
---
apiVersion: v1
kind: Service
metadata:
  name: eqarchives-mcp
  namespace: eqarchives-es
spec:
  selector:
    app: eqarchives-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: mcp-ratelimit
  namespace: eqarchives-es
spec:
  rateLimit:
    average: 5
    burst: 20
    period: 1s
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: mcp-inflight
  namespace: eqarchives-es
spec:
  inFlightReq:
    amount: 8
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eqarchives-mcp
  namespace: eqarchives-es
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: eqarchives-es-securityheaders@kubernetescrd,eqarchives-es-mcp-ratelimit@kubernetescrd,eqarchives-es-mcp-inflight@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: search.eqarchives.org
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: eqarchives-mcp
                port:
                  name: http
  tls:
    - hosts: [search.eqarchives.org]
      secretName: search.eqarchives.org-tls
