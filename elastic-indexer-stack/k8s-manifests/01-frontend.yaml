# Production frontend resources. Runtime secrets are supplied by GitHub Actions.
apiVersion: v1
kind: Namespace
metadata:
  name: eqarchives-es
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: search.eqarchives.org
  namespace: eqarchives-es
spec:
  commonName: search.eqarchives.org
  dnsNames:
  - search.eqarchives.org
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: search.eqarchives.org-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: search-beta.eqarchives.org
  namespace: eqarchives-es
spec:
  commonName: search-beta.eqarchives.org
  dnsNames:
  - search-beta.eqarchives.org
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: search-beta.eqarchives.org-tls
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: securityheaders
  namespace: eqarchives-es
spec:
  headers:
    customFrameOptionsValue: sameorigin
    sslRedirect: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 315360000
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
  namespace: eqarchives-es
spec:
  rateLimit:
    average: 20
    burst: 30
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 0
        excludedIPs: []
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: connectionlimit
  namespace: eqarchives-es
spec:
  inFlightReq:
    amount: 10
    sourceCriterion:
      ipStrategy:
        depth: 0
        excludedIPs: []
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: redirectsearch
  namespace: eqarchives-es
spec:
  redirectRegex:
    regex: ^https?://search-beta.eqarchives.org/(.*)
    replacement: https://search.eqarchives.org/
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-eqarchives-root
  namespace: eqarchives-es
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: eqarchives-es-securityheaders@kubernetescrd,eqarchives-es-ratelimit@kubernetescrd,eqarchives-es-connectionlimit@kubernetescrd,eqarchives-es-redirectsearch@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  rules:
  - host: search.eqarchives.org
    http:
      paths:
      - backend:
          service:
            name: search-eqarchives
            port:
              number: 80
        path: /
        pathType: Prefix
  - host: search-beta.eqarchives.org
    http:
      paths:
      - backend:
          service:
            name: search-eqarchives
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - search.eqarchives.org
    secretName: search.eqarchives.org-tls
  - hosts:
    - search-beta.eqarchives.org
    secretName: search-beta.eqarchives.org-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-eqarchives
  namespace: eqarchives-es
spec:
  progressDeadlineSeconds: 600
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: search-eqarchives
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: search-eqarchives
    spec:
      containers:
      - env:
        - name: LOG_LEVEL
          value: debug
        - name: ELASTICSEARCH_URL
          value: http://elasticsearch.eqarchives-es.svc.cluster.local:9200
        - name: OPENAI_URL
          value: http://nomic-embeddings.eqarchives-es.svc.cluster.local:8080
        - name: ELASTICSEARCH_INDEX
          value: eq-archive
        image: dbsanfte/frontend:deploy-via-ci
        imagePullPolicy: IfNotPresent
        name: search-eqarchives
        ports:
        - containerPort: 80
          protocol: TCP
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - mountPath: /run/secrets
          name: secrets-volume
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        lifecycle:
          preStop:
            exec:
              # Keep accepting requests while endpoint removal reaches Traefik.
              command: ["sleep", "10"]
      imagePullSecrets:
      - name: dockerhub-pull-secret
      # Endpoint propagation + NGINX SIGQUIT draining (proxy timeout up to 60s).
      terminationGracePeriodSeconds: 75
      volumes:
      - name: secrets-volume
        secret:
          defaultMode: 256
          secretName: search-eqarchives-secrets
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: search-eqarchives
  namespace: eqarchives-es
spec:
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: search-eqarchives
