---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: search-beta.eqarchives.org
  namespace: eqarchives-es
spec:
  secretName: search-beta.eqarchives.org-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: search-beta.eqarchives.org
  dnsNames:
  - search-beta.eqarchives.org
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: securityheaders
  namespace: eqarchives-es
spec:
  headers:
    stsPreload: true
    stsSeconds: 315360000
    sslRedirect: true
    stsIncludeSubdomains: true
    customFrameOptionsValue: sameorigin
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
  namespace: eqarchives-es
spec:
  rateLimit:
    average: 20
    burst: 30
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 0
        excludedIPs: []
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: connectionlimit
  namespace: eqarchives-es
spec:
  inFlightReq:
    amount: 10  # Maximum 10 concurrent requests per source IP
    sourceCriterion:
      ipStrategy:
        depth: 0
        excludedIPs: []
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-beta-eqarchives-root
  namespace: eqarchives-es
  annotations:
    "traefik.ingress.kubernetes.io/router.middlewares": eqarchives-es-securityheaders@kubernetescrd,eqarchives-es-ratelimit@kubernetescrd,eqarchives-es-connectionlimit@kubernetescrd
    "traefik.ingress.kubernetes.io/router.entrypoints": websecure
    "traefik.ingress.kubernetes.io/router.tls": "true"
spec:
  tls:
  - hosts:
      - search-beta.eqarchives.org
    secretName: search-beta.eqarchives.org-tls
  rules:
    - host: search-beta.eqarchives.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: search-beta-eqarchives
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-beta-eqarchives
  namespace: eqarchives-es
spec:
  replicas: 4
  selector:
    matchLabels:
      app: search-beta-eqarchives
  template:
    metadata:
      labels:
        app: search-beta-eqarchives
    spec:
      imagePullSecrets:
        - name: dockerhub-pull-secret
      containers:
        - name: search-beta-eqarchives
          image: dbsanfte/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: ELASTICSEARCH_URL
              value: "http://192.168.50.100:31200"
            - name: OPENAI_URL
              value: "http://192.168.50.139:1234"
            - name: ELASTICSEARCH_INDEX
              value: "eq-archive"
          volumeMounts:
            - name: secrets-volume
              mountPath: /var/run/secrets
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: secrets-volume
          secret:
            secretName: search-beta-eqarchives-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: search-beta-eqarchives
  namespace: eqarchives-es
spec:
  selector:
    app: search-beta-eqarchives
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: search-beta-eqarchives-secrets
  namespace: eqarchives-es
type: Opaque
stringData:
  es_readonly_username: ELASTICSEARCH_READONLY_USERNAME
  es_readonly_password: ELASTICSEARCH_READONLY_PASSWORD
  openai_api_key: OPENAI_API_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-pull-secret
  namespace: eqarchives-es
data:
  .dockerconfigjson: DOCKER_CONFIG_JSON
type: kubernetes.io/dockerconfigjson