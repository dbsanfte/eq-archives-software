apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eqarchives-es
commonLabels:
  app.kubernetes.io/part-of: eqarchives-embeddings
resources:
  - device-plugin.yaml
  - deployment.yaml
  - cuda-service.yaml
configMapGenerator:
  - name: nomic-embedding-config
    envs:
      - runtime.env
  - name: nomic-embedding-scripts
    files:
      - download-model.sh
      - start-server.sh
      - check-gpu.sh
# commonLabels adds Service selectors; keep the external laptop endpoint manual.
patchesJson6902:
  - target:
      version: v1
      kind: Service
      name: nomic-embeddings-rtx3080
    patch: |-
      - op: remove
        path: /spec/selector
