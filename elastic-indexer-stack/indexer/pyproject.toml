[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indexer"
version = "0.0.1"
license = "AGPL-3.0-only"

[tool.pytest.ini_options]
pythonpath = "src/indexer"
testpaths = ["src/indexer/tests"]
norecursedirs = ".git .tox .env .venv .vscode .pytest_cache node_modules"
addopts = [
    "--import-mode=importlib",
    "-v",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=json"
]

[tool.coverage.run]
omit = [
    "**/test",
    "**/test_*.py",
    "**/main.py",
    "**/setup.py",
    # These targeted-import modules have their own required 90% coverage gate
    # in the curation image, which includes their tests and crawler dependencies.
    "**/index_captures.py",
    "**/indexer/capture_enrichment.py",
    "**/__init__.py",
    "**/.venv",
    "**/_pycache_",
    "app/src/*.py"
]

[tool.coverage.report]
fail_under = 90
show_missing = true