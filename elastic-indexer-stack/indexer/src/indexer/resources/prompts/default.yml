domain_match_regex: .*

text_prompts: 
  tagging: |-
    You are being supplied with an old Everquest-related website converted to Markdown.

    First, extract the main content of the page. Disregard links, headers, sidebars, and footers.
    
    Below is a list of content tags and descriptions:

      - nerf: The page's main focus is a change to the game that has diminished a specific class' abilities and effectiveness, making it less powerful
      - patch: The page's main focus is a patch to the Everquest game, or recent changes made to the game in a such a patch
      - exploit: The page's main focus is players exploiting a specific bug in the game to their advantage during gameplay
      - bug: The page's main focus is a bug in the game, or a discussion which mentions a bug in the game
      - guide: The page's main focus is a playing strategy or guide on how to do something in the game (Levelling, Questing, Tradeskilling, etc.)
      - lore: The page's main focus is background story lore information about Everquest of an RPG nature, such as the history of the world, etc.
      - event: The page's main focus is an in-game special event run by the GMs or Guides in Everquest
      - pvp: The page's main focus is player versus player combat
      - raid: The page's main focus is raiding content, strategies for raiding, or raiding guilds
      - quest: The page's main focus is the specifics of a quest in the game
      - drama: The page's main focus is player or guild drama/politics in the game, especially arguments between players over in-game loot or competition for monster kills
      - item: The page's main focus is a specific item in the game, especially its stats and/or where to find it
      - tradeskill: The page's main focus is any of the various tradeskills in the game (Alchemy, Blacksmithing, Fletching, Tailoring, Tinkering, Spell Research, etc.)
      - spell: The page's main focus is a spell in the game, especially its effects and/or how to find/research it
      - showeq: Explicitly mentions the use of the ShowEQ third-party software to cheat
      - class-balance: The page's main focus is the balance of classes in the game, specifically whether one class is overpowered or too weak compared to another
      - forum: The page content is a discussion forum, with one or more discussion threads and replies to that thread
    
    Examine the main content of the page only, and decide how many of the above tags apply to it. Disregard links, headers, sidebars, and footers.

    Add all the applicable tags to the list `llm_tags`. If none of the tags apply, leave the list empty.

    Respond in the following JSON format:
    
    {"llm_tags": [ ... ]}

    The content of the website follows:
    ---
    ---

  classification: |-
    Instructions:

    You are being supplied with the content of an old Everquest-related website converted to Markdown. 

    First, extract the main content of the page. Disregard links, headers, sidebars, and footers.

    Then categorize the main content into into one of the following content flavours into the variable `llm_content_flavour`:
    
    - Forum Post
    - Game News
    - Zone Information
    - Item Information
    - Spell Information
    - PvP Information
    - Monster Information
    - Tradeskill Information
    - Strategy Guide
    - Player Character Profile
    - Other 

    Respond in the following JSON format:
    
    {"llm_content_flavour": "..."}

    The text of the page follows:
    ---
    ---


  date: |-
    You are being supplied with the content of an old Everquest-related website. Perform the following two tasks:
  
    1) Extract any dates you see in the content and put them into a json list of `llm_extracted_dates`, each with the JSON object format `{ "date": "YYYY-MM-DD" }`. 

    2) From the dates extracted in step 1, guess the most likely last-updated date of the content. Put it into the string variable `llm_guessed_date` in the format "YYYY-MM-DD". 

    Respond in the following JSON format:
    
    {"llm_guessed_date": "...", "llm_extracted_dates": [ ... ] }

    IMPORTANT: 
    * If a date occurs multiple times, only include it once in `llm_extracted_dates`.
    * `llm_guessed_date` MUST be one of the dates extracted in `llm_extracted_dates`. 

    The content of the website follows:
    ---
    ---

  summary: |-
    Instructions:

    You are being supplied with the content of a page from an old Everquest-related website converted to Markdown. 

    First, extract the main content of the page. Disregard links, headers, sidebars, and footers.

    Then describe and summarize it 500 characters or less into the variable `llm_summary`. Disregard links, headers, sidebars, and footers. Do not include the URL in the summary.

    Respond in the following JSON format:
  
    {"llm_summary": "..."}

    The content of the webpage follows:
    ---
    ---



image_prompts: 
  summary: |-
    Attached is an archived image from an old Everquest-related website. 

    Describe and summarize the image into the variable `llm_summary`.

    Respond in the following JSON format:
    
    {"llm_summary": "..."}

    The image follows:
    ---
    ---

  classification: |-
    Attached is an archived image from an old Everquest-related website. 

    Categorize it into into one of the following content flavours into the variable `llm_content_flavour`:
    
    - Game Screenshot
    - Item Stats
    - Monster
    - Player Character Portrait
    - Other

    Respond in the following JSON format:
    
    {"llm_content_flavour": "..."}

    The image follows:
    ---
    ---

  tagging: |-
    Attached is an archived image from an old Everquest-related website. 

    Below is a list of content tags. Examine the content and decide if any of the tags apply. Add all the applicable tags to the list "llm_tags". 
    - screenshot: An in-game screenshot from the game Everquest itself
    - item: A picture/screenshot of a specific item in the game, especially its stats and/or where to find it
    - monster: A screenshot of a monster in the game
    - art: The image is primarily artistic and not a game screenshot
    - player: The image contains an Everquest player character

    Respond in the following JSON format:
    
    {"llm_tags": [ ... ] }

    The image follows:
    ---
    ---

  text_extraction: |-
    Attached is an archived image from an old Everquest-related website. 

    Extract any phrases from the image into the string array variable `llm_image_text`.

    Respond in the following JSON format:
    
    {"llm_image_text": [ ... ] }

    The image follows:
    ---
    ---
