domain_match_regex: groups\.google\.com$

text_prompts: 
  initial: |-
    You are being supplied with an old Everquest-related newsgroup post.
    
    Don't do anything yet, wait for further instructions.
    
    The content of the newsgroup post follows:
    ---
    ---

  tagging: |-
    Consider the newsgroup post.

    Below is a list of content tags and descriptions:
      - nerf: Discusses a change to the game that has diminished a specific class' abilities and effectiveness, making it less powerful
      - patch: Discusses recent changes made to the game in a patch update
      - exploit: Discusses players exploiting a specific bug in the game to their advantage during gameplay
      - bug: Discusses a bug in the game
      - guide: Provides a playing strategy or guide on how to do something in the game (Levelling, Questing, Tradeskilling, etc.)
      - lore: Provides background story lore information about Everquest
      - event: Discusses a special in-game special event run by the GMs or Guides in Everquest
      - pvp: Discusses player versus player combat
      - raid: Discusses raiding content, strategies for raiding, or raiding guilds
      - quest: Discusses the specifics of a quest in the game
      - drama: Discusses player or guild drama/politics in the game, especially arguments between players over in-game loot or competition for monster kills
      - item: Discusses a specific item in the game, especially its stats and/or where to find it
      - tradeskill: Discusses any of the various tradeskills in the game (Alchemy, Blacksmithing, Fletching, Tailoring, Tinkering, Spell Research, etc.)
      - spell: Discusses a spell in the game, especially its effects and/or how to find/research it
      - showeq: Discusses the use of the ShowEQ third-party software to cheat
      - class-balance: Discusses the balance of classes in the game, specifically whether one class is overpowered or too weak compared to another
    
    Examine the content and decide how many of the above tags apply to it. Add all the applicable tags to the list `llm_tags`. If none of the tags apply, leave the list empty. Do not duplicate tags, and do not add tags that are not in the list above.

    Example response JSON:
    ```json
    {
      "llm_tags": [ 
        "tag1",
        "tag2"
      ] 
    }
    ```

  classification: |-
    Categorize the post into into the following content flavour into the variable `llm_content_flavour`:
    - Newsgroup Post

    Respond in the following JSON format:
    
    ```json
    {
      "llm_content_flavour": "..."
    }
    ```

  date: |-
    Consider the newsgroup post, and perform the following two tasks:
  
    1) Extract any dates you see in the content and put them into a json list of `llm_extracted_dates`, each with the JSON object format `{ "date": "YYYY-MM-DD" }`. 

    2) From the dates extracted in step 1, guess the most likely last-updated date of the content. Put it into the string variable `llm_guessed_date` in the format "YYYY-MM-DD". 

    Respond in the following JSON format:
    
    ```json
    {
      "llm_guessed_date": "YYYY-MM-DD",
      "llm_extracted_dates": [
        { "date": "YYYY-MM-DD" },
        { "date": "YYYY-MM-DD" }
      ]
    }
    ```

    IMPORTANT: 
    * If a date occurs multiple times, only include it once in `llm_extracted_dates`.
    * `llm_guessed_date` MUST be one of the dates extracted in `llm_extracted_dates`. 

  summary: |-
    Describe and summarise the newsgroup post into the variable `llm_summary`.

    Respond in the following JSON format:
  
    ```json
    {
      "llm_summary": "..."
    }
    ```

image_prompts: 
  summary: |-
    Attached is an archived image from an old Everquest-related website. 

    Describe and summarize the image into the variable `llm_summary`.

    Respond in the following JSON format:
    
    ```json
    {
      "llm_summary": "..."
    }
    ```


  classification: |-
    Attached is an archived image from an old Everquest-related website. 

    Categorize it into into one of the following content flavours into the variable `llm_content_flavour`:
    
    - Game Screenshot
    - Item Stats
    - Monster
    - Player Character Portrait
    - Other

    Respond in the following JSON format:
    
    ```json
    {
      "llm_content_flavour": "..."
    }
    ```


  tagging: |-
    Attached is an archived image from an old Everquest-related website. 

    Below is a list of content tags. Examine the content and decide if any of the tags apply. Add all the applicable tags to the list "llm_tags". 
    - screenshot: An in-game screenshot from the game Everquest itself
    - item: A picture/screenshot of a specific item in the game, especially its stats and/or where to find it
    - monster: A screenshot of a monster in the game
    - art: The image is primarily artistic and not a game screenshot
    - player: The image contains an Everquest player character

    Respond in the following JSON format:
    
    ```json
    {
      "llm_tags": [ 
        "tag1",
        "tag2"
      ]
    }
    ```


  text_extraction: |-
    Attached is an archived image from an old Everquest-related website. 

    Extract any phrases from the image into the string array variable `llm_image_text`.

    Respond in the following JSON format:
    
    ```json
    {
      "llm_image_text": [ 
        "...",
        "..." 
      ]
    }
    ```
