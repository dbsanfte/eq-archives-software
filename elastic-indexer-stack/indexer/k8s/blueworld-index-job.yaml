# One-off recovery job. Apply this file separately from the frontend Kustomization.
# Build/import the local image on eqvm and update its tag if the code changes.
apiVersion: batch/v1
kind: Job
metadata:
  name: index-blueworld-pre2000
  namespace: eqarchives-es
spec:
  backoffLimit: 1
  parallelism: 1
  completions: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: indexer
          image: eqarchives-indexer:blueworld-recovery
          imagePullPolicy: Never
          command: ["python", "-u", "index_blueworld.pyc"]
          env:
            - name: LOCAL_REPO_PATH
              value: /data/eq-archives
            - name: ELASTICSEARCH_HOST
              value: http://elasticsearch.eqarchives-es.svc.cluster.local
            - name: ELASTICSEARCH_PORT
              value: "9200"
            - name: ELASTICSEARCH_INDEX
              value: eq-archive
            - name: ELASTICSEARCH_USERNAME
              value: elastic
            - name: OPENAI_ENDPOINT
              value: http://nomic-embeddings.eqarchives-es.svc.cluster.local:8080/v1
            - name: OPENAI_EMBEDDING_MODEL_NAME
              value: text-embedding-nomic-embed-text-v1.5@q8_0
            - name: SKIP_LLM_ENRICHMENT
              value: "true"
          volumeMounts:
            - name: archive
              mountPath: /data/eq-archives
              readOnly: true
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: archive
          hostPath:
            path: /mnt/samsung/eq-archives
            type: Directory
        - name: credentials
          projected:
            sources:
              - secret:
                  name: elastic-password-secret
                  items:
                    - key: ELASTIC_PASSWORD
                      path: es_password
              - secret:
                  name: search-eqarchives-secrets
                  items:
                    - key: openai_api_key
                      path: openai_api_key
