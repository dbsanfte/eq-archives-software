name: CI/CD

on:
  pull_request:
    branches: [ "master" ]
  push:
    tags:
      - v*
  
jobs:
  build-and-push:
    runs-on: eqvm  # The self-hosted runner label
    strategy:
      fail-fast: false
      matrix:
       include:
         - repo: indexer
           path: ./elastic-indexer-stack/indexer
         - name: frontend
           path: ./elastic-indexer-stack/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Cardano-Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            dbsanfte/${{ matrix.repo_name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker images to registry
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

